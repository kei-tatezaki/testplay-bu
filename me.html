<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>マイページ｜テストプレイ部</title>
<meta name="theme-color" content="#F6F1E7">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/side.css">
<style>
.mehead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.mehead .who{flex:1;min-width:160px}
.mehead h1{margin:0;font-size:20px;line-height:1.3}
.mehead .acts{display:flex;gap:8px;flex-wrap:wrap}
.mehead .btn{padding:8px 14px;font-size:14px}
.pane{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);overflow-wrap:anywhere}
.avrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.count{font-weight:400;color:var(--muted);font-size:12px;justify-self:end}
.idrow{display:flex;align-items:center;gap:4px}
.idrow span{color:var(--muted);font-weight:400}
.subs{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.sub,.sub>*{min-width:0;overflow-wrap:anywhere}
.sub{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;display:grid;gap:2px;background:var(--card)}
.st{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--soft);color:var(--shu-ink)}
.st.ng{background:var(--shu-soft);color:#B0301B}
.note{font-size:13px;color:var(--muted);margin:0}
.ptbig{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.ptbig b{font-size:34px;line-height:1.1;color:var(--shu-ink)}
.ptlist{display:grid;gap:0;margin:0;padding:0;list-style:none}.ptlist li{display:flex;gap:10px;justify-content:space-between;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);font-size:14px}.ptlist li:first-child{border-top:0}.ptlist .d{font-weight:700;white-space:nowrap}.ptlist .d.minus{color:#B0301B}.ptlist small{display:block;color:var(--muted);font-size:12px}
.hday{margin:10px 0 0;font-size:14px;font-weight:800;color:var(--ink);padding-bottom:4px;border-bottom:1px solid var(--line)}
.hlist{margin:0;padding:0;list-style:none;display:grid;gap:0}
.hlist li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hlist .t{font-weight:700;color:var(--ao)}
.hlist .k{grid-column:1;font-size:13px;color:var(--muted)}
.hlist time{grid-row:1/3;grid-column:2;font-size:13px;color:var(--muted);white-space:nowrap}
.hbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hbar .btn{padding:8px 14px;font-size:14px}
.btn.confirm,button.btn.confirm{background:var(--shu-ink);border-color:var(--shu-ink);color:#fff}
.unlike{justify-self:start;border:0;background:none;padding:6px 0;min-height:44px;font:inherit;font-size:13px;color:var(--shu-ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;display:inline-flex;align-items:center}
.sw{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.sw input{position:absolute;opacity:0;width:44px;height:28px;margin:0;cursor:pointer}
.sw .tr{flex:none;position:relative;width:44px;height:26px;border-radius:13px;background:#fff;border:2px solid var(--muted);transition:background .15s ease,border-color .15s ease}
.sw .tr::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s ease,background .15s ease}
.sw input:checked+.tr{background:var(--shu-ink);border-color:var(--shu-ink)}
.sw input:checked+.tr::after{transform:translateX(18px);background:#fff}
.sw input:focus-visible+.tr{outline:3px solid var(--ink);outline-offset:2px}
.sw input:disabled+.tr{opacity:.5}
.sw .tx{display:grid;gap:2px}.sw .tx b{font-size:15px}
.sw{position:relative}
.callout{border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;display:grid;gap:8px;justify-items:center}
@media (min-width:1024px){
.mehead{display:grid;justify-items:center;text-align:center;gap:10px;padding:24px 20px}
.mehead .who{flex:none;min-width:0;width:100%}
.mehead .tpb-av{width:96px!important;height:96px!important;font-size:40px!important}
.mehead .acts{display:grid;width:100%;gap:8px}
.mehead .acts .btn{justify-content:center}
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap wide">
<header class="bar"><a class="brand" href="./"><img src="assets/icon-192.png" alt="" width="32" height="32">テストプレイ部</a><span class="brand-tag" aria-hidden="true">学生のゲームを、学生が遊ぶ部室</span><span class="bar-r"><a class="ghost-link hide-sm" href="./list.html">作品一覧</a><a class="btn" href="./">▶ ショート</a></span></header>
<main id="main" class="stack"><p class="empty">読み込み中…</p></main>
<footer><a href="./creators.html">作品を載せたい人へ</a> ・ <a href="./privacy.html">集める情報と使い道</a></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/data.js"></script>
<script src="assets/tpb.js"></script>
<script src="assets/mission.js"></script>
<script>
(function(){
"use strict";
const T=TPB, el=T.el, main=document.getElementById('main'); const _rc=main.replaceChildren.bind(main); main.replaceChildren=(...a)=>_rc(...a.filter(x=>x!=null&&x!==false)); const sb=T.sb();
let SES=null, ISADMIN=false, PROFILE=null, TAB='games', MINE=[], STATS={}, PTS=null;
const ERR={bad_handle:'IDは、半角の英小文字・数字・_ で3〜20文字にしてね',handle_taken:'そのIDはもう使われています。別のIDにしてね',bad_name:'その名前は使えません（1〜30文字。「運営」「公式」は使えません）',
  bad_bio:'ひとことは160文字までにしてね',banned_word:'使えない言葉が入っているみたい。言い方を変えてみてね',bad_links:'リンクは https:// から始まるURLにしてね（6つまで）',
  bad_video:'紹介動画はYouTubeのURLにしてね',bad_avatar:'アイコンの画像を保存できませんでした。もう一度選んでね',banned:'このアカウントでは変更できなくなっています。心当たりがない場合は運営に連絡してね',not_logged_in:'ログインが切れたみたい。もう一度ログインしてね'};
function nameOf(){ const m=(SES.user.user_metadata)||{}; return (PROFILE&&PROFILE.name)||m.full_name||m.name||(SES.user.email||'').split('@')[0]||'あなた' }

async function start(){
  SES=sb?await T.session():null;
  if(!SES){
    main.replaceChildren(T.loginBox('ログイン','ログインすると、プロフィールを作ったり、送った感想を見返したり、自分の作品を応募したりできます。遊ぶだけならログインはいりません。'),
      stampBox(), guestRecords());
    return;
  }
  const [p, mine, stats] = await Promise.all([
    sb.rpc('my_profile').then(r=>r.data||null,()=>null), T.myGames(), T.pub('game_stats',{since_days:3650})]);
  try{ ISADMIN=(await sb.rpc('is_admin')).data===true }catch(e){ ISADMIN=false }
  PROFILE=p; MINE=mine||[]; STATS={}; (stats||[]).forEach(r=>STATS[r.game_slug]=r);
  if(p) T.store.set('me',{name:p.name,avatar_url:p.avatar_url||'',handle:p.handle});
  if(location.hash==='#edit'||!PROFILE) TAB='edit';
  if(location.hash==='#fb') TAB='fb'; if(location.hash==='#pt') TAB='pt'; if(location.hash==='#stamp') TAB='stamp'; if(location.hash==='#played'||location.hash==='#history') TAB='history'; if(location.hash==='#likes') TAB='likes'; if(location.hash==='#games') TAB='games';
  render();
  addEventListener('hashchange',()=>{ const k=location.hash.slice(1)==='played'?'history':location.hash.slice(1); if(['games','likes','history','fb','pt','stamp','edit'].includes(k)&&k!==TAB){ TAB=k; render() } });
  // PCの本人カードに出すポイント（取れなかったら出さない。スマホでは隠れている）
  try{ const r=await sb.rpc('my_points'); if(r&&r.data){ PTS=r.data; fillPts() } }catch(e){}
}
// ログインしていない人にも、この端末のいいね・履歴は見せる（タブは「いいね」「履歴」だけ）
function guestRecords(){
  let t=location.hash==='#likes'?'likes':'history'; const box=el('section',{style:'display:grid;gap:12px'});
  const draw=()=>{ const pane=el('div',{class:'pane'});
    const bar=el('div',{class:'tabs',role:'tablist','aria-label':'この端末の記録'},[['likes','いいね'],['history','履歴']].map(([k,l])=>el('button',{type:'button',role:'tab','aria-selected':String(k===t),onclick:()=>{ t=k; draw() }},l)));
    box.replaceChildren(el('h2',{style:'margin:8px 0 0;font-size:16px'},'この端末の記録'),bar,pane); (t==='likes'?paneLikes:paneHistory)(pane) };
  draw(); return box;
}
function fillPts(){ const n=document.querySelector('.mepts'); if(!n) return; n.replaceChildren(); if(PTS&&typeof PTS.balance==='number') n.append(el('b',null,PTS.balance+'pt'),'いまのポイント') }
function render(){
  main.classList.add('cols');
  const tabs=[['games','自分の作品'],['likes','いいね'],['history','履歴'],['fb','送った感想'],['pt','ポイント'],['stamp','スタンプ'],['edit','プロフィール']];
  const pane=el('div',{class:'pane',id:'pane',role:'tabpanel'});
  const head=el('section',{class:'card'},el('div',{class:'body mehead'},
    T.avatar({name:nameOf(),avatar:PROFILE&&PROFILE.avatar_url},64),
    el('div',{class:'who'},el('h1',null,nameOf()),el('div',{class:'by'},PROFILE&&PROFILE.handle?'@'+PROFILE.handle:PROFILE?'ハンドル未設定':'プロフィールはまだありません'),
      PROFILE&&PROFILE.hidden?el('div',{class:'msg err'},'このプロフィールは運営が非表示にしています'):null),
    PROFILE&&PROFILE.bio?el('p',{class:'mebio'},PROFILE.bio):null,
    el('div',{class:'mepts'}),
    el('div',{class:'acts'},
      PROFILE?el('a',{class:'btn ghost',href:T.profileUrl(PROFILE.handle)},'公開プロフィールを見る'):null,
      ISADMIN?el('a',{class:'btn ghost',href:'./admin.html'},'管理ページ'):null,
      el('button',{class:'btn ghost',type:'button',onclick:async()=>{ await sb.auth.signOut(); T.store.set('me',null); location.reload() }},'ログアウト'))));
  const bar=el('div',{class:'tabs',role:'tablist','aria-label':'マイページ'},tabs.map(([k,l])=>el('button',{type:'button',role:'tab',id:'tab-'+k,'aria-selected':String(k===TAB),tabindex:k===TAB?'0':'-1',onclick:()=>{ TAB=k; history.replaceState(null,'','#'+k); render() }},l)));
  // ← → Home End でもタブを切りかえられる
  bar.addEventListener('keydown',e=>{ const ks=tabs.map(t=>t[0]); let i=ks.indexOf(TAB);
    if(e.key==='ArrowRight') i=(i+1)%ks.length; else if(e.key==='ArrowLeft') i=(i-1+ks.length)%ks.length; else if(e.key==='Home') i=0; else if(e.key==='End') i=ks.length-1; else return;
    e.preventDefault(); TAB=ks[i]; history.replaceState(null,'','#'+TAB); render(); const b=document.getElementById('tab-'+TAB); if(b) b.focus() });
  main.replaceChildren(el('div',{class:'sidecol'},head),el('div',{class:'maincol'},bar,pane));
  fillPts();
  { const tb=document.getElementById('tab-'+TAB); if(tb&&bar.scrollWidth>bar.clientWidth) bar.scrollLeft=Math.max(0,tb.offsetLeft-(bar.clientWidth-tb.offsetWidth)/2) }   // 横にはみ出すとき、選んでいるタブを見える位置に
  ({games:paneGames,likes:paneLikes,history:paneHistory,fb:paneFb,pt:panePoints,stamp:paneStamp,edit:paneEdit})[TAB](pane);
}

// ---- 今日のスタンプカード（assets/mission.js。ポイントはデータベースが決めた値を見せるだけ） ----
function stampBox(){
  const M=T.mission, box=el('section',{class:'card msc ms-inline',id:'stampCard','aria-label':'今日のスタンプカード'});
  if(!M){ box.append(el('p',{class:'note'},'スタンプカードを読み込めませんでした。ページを開きなおしてね。')); return box }
  M.draw(box,{}); M.refresh().then(()=>{ if(box.isConnected) M.draw(box,{}) });
  return box;
}
function paneStamp(pane){ pane.append(stampBox()) }
// ---- 自分の作品 ----
async function paneGames(pane){
  const games=MINE.map(T.game).filter(Boolean);
  pane.append(games.length?el('div',{class:'grid'},games.map(g=>T.tile(g,STATS[g.slug],{extra:el('a',{class:'by',href:'./dev.html?g='+g.slug,style:'color:var(--shu-ink)'},'数字と感想を見る')})))
    :el('div',{class:'callout eb'},T.ebImg(),el('b',{class:'eb-t'},'まだあなたの作品はありません。次は、遊べるURLを用意して応募してみよう'),
      el('p',{class:'note'},'ブラウザで遊べるURLがあれば、ここから応募できます。運営が確かめてから載せます。'),
      el('a',{class:'btn',href:'./submit.html'},'作品を応募する'),
      el('a',{class:'by',href:'./creators.html#url'},'遊べるURLの作り方を見る')));
  if(games.length) pane.append(el('p',{style:'margin:0'},el('a',{class:'btn',href:'./submit.html'},'＋ 作品を応募する')));
  const box=el('div',{class:'subs'}); pane.append(box);
  try{
    const {data}=await sb.rpc('my_submissions'); if(!data||!data.length) return;
    const ST={new:['確認中',''],ok:['載せました',''],ng:['見送り','ng']}, STE={new:['確認中',''],ok:['直しました',''],ng:['見送り','ng']};
    box.append(el('h2',{style:'margin:8px 0 0;font-size:16px'},'応募したもの'));
    data.forEach(s=>{ const g=s.game_slug&&T.game(s.game_slug);
      box.append(el('div',{class:'sub'},
        el('div',null,el('span',{class:'st '+(s.kind==='edit'?STE:ST)[s.status][1]},(s.kind==='edit'?STE:ST)[s.status][0]),' ',el('b',null,s.kind==='edit'?'直しの依頼：'+(g?g.title:s.game_slug):(s.data.title||'（タイトルなし）'))),
        el('div',{class:'by'},new Date(s.created_at).toLocaleDateString('ja-JP')+(s.kind==='new'&&s.data.play_url?' ・ '+s.data.play_url:'')),
        s.kind==='new'&&s.data&&s.data.media_kind?el('div',null,el('span',{class:'chip'},({video:'動画あり',image:'画像あり',auto:'おまかせ'})[s.data.media_kind]||'おまかせ')):null,
        s.kind==='edit'&&s.data.note?el('div',null,s.data.note):null,
        s.admin_note?el('div',null,'運営から：'+s.admin_note):null)) });
  }catch(e){}
}
// ---- いいね ----
// ログイン中はアカウントの user_likes、ログインしていなければこの端末の tpb:reacts
async function paneLikes(pane){
  pane.append(el('p',{class:'empty'},'読み込み中…'));
  let rows=[], failed=false;
  if(SES){ try{ const r=await sb.from('user_likes').select('game_slug,created_at').order('created_at',{ascending:false}).limit(500); if(r.error) throw r.error; rows=r.data||[] }catch(e){ failed=true } }
  else rows=T.hist.localLikes().reverse().map(g=>({game_slug:g}));
  if(!pane.parentNode) return;
  pane.replaceChildren();
  if(failed){ pane.append(el('div',{class:'callout'},el('b',null,'いいねを読み込めませんでした'),el('p',{class:'note'},'時間をおいて、もう一度開いてね。'),el('button',{class:'btn',type:'button',onclick:()=>render()},'もう一度'))); return }
  const games=rows.map(r=>T.game(r.game_slug)).filter(Boolean);
  if(!games.length){
    pane.append(el('div',{class:'callout eb'},T.ebImg(),el('b',{class:'eb-t'},'まだ「いいね」した作品はありません。気に入った作品に押してみてね'),
      el('p',{class:'note'},'ショートで作品を見て「いいね」を押すと、ここに新しい順で集まります。'),el('a',{class:'btn',href:'./'},'▶ ショートで探す')));
    return }
  pane.append(el('p',{class:'note'},games.length+'本の作品にいいねしました。新しい順です。'+(SES?'':'ログインすると、どの端末からでも見られます。')));
  const grid=el('div',{class:'grid'}); pane.append(grid);
  games.forEach(g=>{ const btn=el('button',{class:'unlike',type:'button','aria-label':g.title+' のいいねを外す'},'いいねを外す');
    const tile=T.tile(g,STATS[g.slug],{extra:btn});
    btn.addEventListener('click',async()=>{ btn.disabled=true;
      T.hist.unlikeLocal(g.slug);
      if(SES){ try{ const r=await sb.from('user_likes').delete().eq('game_slug',g.slug); if(r.error) throw r.error }catch(e){ btn.disabled=false; T.toast('外せませんでした。もう一度試してね'); return } }
      tile.remove(); T.toast('いいねを外したよ',1500);
      if(!grid.children.length) paneLikes(pane.replaceChildren()||pane) });
    grid.append(tile) });
}
// ---- 履歴（見た・遊んだ） ----
const dayKey=d=>d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
function dayLabel(d,now){ const y=new Date(now); y.setDate(y.getDate()-1);
  if(dayKey(d)===dayKey(now)) return '今日'; if(dayKey(d)===dayKey(y)) return '昨日';
  return (d.getFullYear()===now.getFullYear()?'':d.getFullYear()+'年')+(d.getMonth()+1)+'月'+d.getDate()+'日' }
async function paneHistory(pane){
  pane.append(el('p',{class:'empty'},'読み込み中…'));
  let rows=[], failed=false;
  if(SES){ try{ const r=await sb.from('user_history').select('game_slug,kind,seconds,created_at').order('created_at',{ascending:false}).order('id',{ascending:false}).limit(500); if(r.error) throw r.error; rows=(r.data||[]).map(x=>({slug:x.game_slug,kind:x.kind,seconds:x.seconds,at:new Date(x.created_at).getTime()})) }catch(e){ failed=true } }
  else rows=T.hist.local();
  if(!pane.parentNode) return;
  pane.replaceChildren();
  if(failed){ pane.append(el('div',{class:'callout'},el('b',null,'履歴を読み込めませんでした'),el('p',{class:'note'},'時間をおいて、もう一度開いてね。'),el('button',{class:'btn',type:'button',onclick:()=>render()},'もう一度'))); return }
  rows=rows.filter(r=>T.game(r.slug));
  if(!rows.length){
    pane.append(el('div',{class:'callout eb'},T.ebImg(),el('b',{class:'eb-t'},'まだ履歴はありません。気になった1本を見たり遊んだりしてみてね'),
      el('p',{class:'note'},'ショートで2秒以上見た作品と、遊んだ作品がここに残ります。見られるのは自分だけです。'+(SES?'':'ログインすると、どの端末からでも見られます。')),el('a',{class:'btn',href:'./'},'▶ ショートで探す')));
    return }
  // 上：説明と「履歴を消す」（二度押しで確定。alert / confirm は使わない）
  let armed=0; const clr=el('button',{class:'btn ghost',type:'button'},'履歴を消す');
  clr.addEventListener('click',async()=>{
    if(!armed){ armed=1; clr.textContent='本当に消す（もう一度押す）'; clr.className='btn confirm'; setTimeout(()=>{ if(armed===1){ armed=0; clr.textContent='履歴を消す'; clr.className='btn ghost' } },5000); return }
    clr.disabled=true;
    if(SES){ try{ const r=await sb.from('user_history').delete().gt('id',0); if(r.error) throw r.error }catch(e){ clr.disabled=false; armed=0; clr.textContent='履歴を消す'; clr.className='btn ghost'; T.toast('消せませんでした。もう一度試してね'); return } }
    T.hist.clearLocal(); T.toast('履歴を消したよ',1500); paneHistory(pane.replaceChildren()||pane) });
  pane.append(el('div',{class:'hbar'},el('p',{class:'note'},SES?'見たのも遊んだのも、自分だけが見られます。新しい順に最大500件です。':'この端末の記録です（新しい順に最大200件）。ログインするとどの端末からでも見られます。'),clr));
  const now=new Date(); let cur='', ul=null;
  rows.forEach(r=>{ const d=new Date(r.at), g=T.game(r.slug), k=dayKey(d);
    if(k!==cur){ cur=k; pane.append(el('h3',{class:'hday'},dayLabel(d,now))); ul=el('ul',{class:'hlist'}); pane.append(ul) }
    ul.append(el('li',null,el('a',{class:'t',href:'./games/'+r.slug+'/'},g.title),
      el('span',{class:'k'},r.kind==='play'?(r.seconds?'遊んだ・'+T.hist.secText(r.seconds):'遊んだ'):'見た'),
      el('time',{datetime:d.toISOString()},String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')))) });
}
// ---- 送った感想 ----
async function paneFb(pane){
  pane.append(el('p',{class:'empty'},'読み込み中…'));
  let rows=[]; try{ rows=(await sb.rpc('my_feedback')).data||[] }catch(e){}
  pane.replaceChildren();

  pane.append(el('p',{class:'note'},rows.length+'件の感想を送りました。作った人には、だれが書いたかは見えません。'));
  const list=el('section',{class:'card'},el('div',{class:'body fblist'}));
  rows.forEach(f=>{ const g=T.game(f.game_slug);
    list.firstChild.append(el('div',{class:'fbitem'},
      el('div',null,el('a',{href:'./games/'+f.game_slug+'/',style:'font-weight:700'},g?g.title:f.game_slug),' ',
        f.liked_by_dev?el('span',{class:'chip check'},'作者のいいね'):null, f.hidden?el('span',{class:'chip rate-r18'},'運営が非表示にしました'):null),
      el('div',null,el('b',null,f.again),' ・ '+f.reach),
      (f.good||[]).length?el('div',null,'よかった：'+f.good.join('、')):null,
      (f.bad||[]).length?el('div',null,'気になった：'+f.bad.join('、')):null,
      f.free?el('p',null,f.free):null,
      el('div',{class:'by'},new Date(f.created_at).toLocaleDateString('ja-JP')))) });
  pane.append(list);
}

      :d.balance>=d.submit_cost?el('p',{style:'margin:0'},'作品を応募できます（'+d.submit_cost+'pt つかいます）。')
      :el('p',{style:'margin:0'},'作品の応募には '+d.submit_cost+'pt いります。あと '+need+'pt です。'),

      el('a',{class:'btn',href:'./'},'▶ 感想を書いてためる'),
      el('a',{class:'btn ghost',href:'./submit.html'},'作品を応募する')))));
  const rec=d.recent||[];

      el('span',{class:'d'+(x.delta<0?' minus':'')},(x.delta>0?'+':'')+x.delta+'pt'))))

// 画像は、送る前にブラウザの中で 256×256 に小さくする（撮った場所などの情報もここで消える）
function shrink(file){
  return new Promise((ok,ng)=>{ const im=new Image(), url=URL.createObjectURL(file);
    im.onload=()=>{ const s=Math.min(im.naturalWidth,im.naturalHeight), c=document.createElement('canvas'); c.width=c.height=256;
      c.getContext('2d').drawImage(im,(im.naturalWidth-s)/2,(im.naturalHeight-s)/2,s,s,0,0,256,256); URL.revokeObjectURL(url);
      c.toBlob(b=>b?ok(b):ng(new Error('blob')),'image/jpeg',.86) };
    im.onerror=()=>{ URL.revokeObjectURL(url); ng(new Error('image')) }; im.src=url });
}
// 「いいねした作品を公開する」（既定はオフ。オンにした人だけ、公開プロフィールに出る）
function publicBox(){
  const on=!!(PROFILE&&PROFILE.likes_public), msg=el('p',{class:'msg','aria-live':'polite'});
  const cb=el('input',{type:'checkbox',role:'switch',id:'likesPublic',disabled:!PROFILE}); cb.checked=on;
  cb.addEventListener('change',async()=>{ const want=cb.checked; cb.disabled=true; msg.className='msg'; msg.textContent='';
    try{ const r=await sb.rpc('likes_public_set',{p_on:want}); if(r.error) throw r.error; PROFILE.likes_public=want; T.toast(want?'いいねした作品を公開したよ':'いいねした作品を非公開にしたよ',1800) }
    catch(e){ cb.checked=!want; msg.className='msg err'; msg.textContent=(e&&e.message==='banned')?ERR.banned:'切りかえられませんでした。時間をおいてもう一度試してね' }
    cb.disabled=false });
  return el('section',{class:'card'},el('div',{class:'body',style:'display:grid;gap:8px'},el('h2',{style:'margin:0 0 2px;font-size:16px'},'公開の設定'),
    el('label',{class:'sw','for':'likesPublic'},cb,el('span',{class:'tr','aria-hidden':'true'}),el('span',{class:'tx'},el('b',null,'いいねした作品を公開する'),
      el('small',{class:'note'},PROFILE?'オンにすると、あなたの公開プロフィールに「いいねした作品」が出ます。いつでもオフにできます。履歴は公開されません。':'先にプロフィール（名前とID）を作ると選べます。'))),msg));
}
function paneEdit(pane){
  const p=PROFILE||{handle:'',name:'',bio:'',avatar_url:'',links:[],video:''};
  let avatarUrl=p.avatar_url||'', newBlob=null;
  const msg=el('p',{class:'msg','aria-live':'polite'});
  const avBox=el('span',null,T.avatar({name:p.name||'？',avatar:avatarUrl},72));
  const file=el('input',{type:'file',accept:'image/png,image/jpeg,image/webp',hidden:true});
  file.addEventListener('change',async()=>{ const f=file.files[0]; if(!f) return;
    try{ newBlob=await shrink(f); avBox.replaceChildren(T.avatar({name:'',avatar:URL.createObjectURL(newBlob)},72)); msg.className='msg'; msg.textContent='画像を選びました。「保存する」を押すと変わります' }
    catch(e){ msg.className='msg err'; msg.textContent='この画像は使えませんでした。PNGかJPEGの画像を選んでね' } });
  const name=el('input',{type:'text',maxlength:30,value:p.name,placeholder:'ゲームを作っている名前',required:true,autocomplete:'nickname'});
  const handle=el('input',{type:'text',maxlength:20,value:p.handle,placeholder:'例：taro_games',autocapitalize:'none',autocomplete:'off',spellcheck:'false',pattern:'[a-z0-9_]{3,20}'});
  const bio=el('textarea',{maxlength:160,placeholder:'例：大学2年。Unityで2Dアクションを作っています。'}); bio.value=p.bio||'';
  const cnt=el('span',{class:'count'}); const upd=()=>cnt.textContent=[...bio.value].length+' / 160'; bio.addEventListener('input',upd); upd();
  const links=[0,1,2,3].map(i=>el('input',{type:'url',inputmode:'url',maxlength:200,value:(p.links||[])[i]||'',placeholder:['https://x.com/あなたのID','https://あなたのID.itch.io','https://unityroom.com/users/…','自分のサイトなど'][i],'aria-label':'リンク'+(i+1)}));
  const video=el('input',{type:'url',inputmode:'url',maxlength:200,value:p.video||'',placeholder:'https://www.youtube.com/watch?v=…'});
  const save=el('button',{class:'btn',type:'submit'},'保存する');
  const form=el('form',{class:'form card',novalidate:true,style:'padding:16px;max-width:640px;width:100%;margin:0 auto'},
    PROFILE?null:el('p',{class:'q',style:'margin:0'},el('b',null,'プロフィールを作ろう'),'名前とIDを決めるだけでOK。あとから変えられます。'),
    el('div',{class:'avrow'},avBox,el('div',{style:'display:grid;gap:4px'},el('button',{class:'btn ghost',type:'button',onclick:()=>file.click()},'アイコンの画像を選ぶ'),
      avatarUrl?el('button',{type:'button',class:'by',style:'border:0;background:none;text-decoration:underline;cursor:pointer;text-align:left;padding:4px 0',onclick:()=>{ avatarUrl=''; newBlob=null; avBox.replaceChildren(T.avatar({name:name.value},72)) }},'画像をはずす'):null,
      el('span',{class:'hint'},'自分で用意した画像を使ってね。写真は顔がわからないものがおすすめ')),file),
    el('label',null,el('span',null,'名前 ',el('small',null,'ここに入れた名前は、みんなに見えます')),name),
    el('label',null,el('span',null,'ID ',el('small',null,'プロフィールのURLになります。半角の英小文字・数字・_ で3〜20文字')),el('span',{class:'idrow'},el('span',null,'@'),handle)),
    el('label',null,el('span',null,'ひとこと ',el('small',null,'書かなくてもOK')),bio,cnt),
    el('div',{style:'display:grid;gap:6px'},el('b',{style:'font-size:14px'},'リンク ',el('small',{class:'hint'},'X・YouTube・itch.io・unityroom・自分のサイトなど')),links),
    el('label',null,el('span',null,'紹介動画 ',el('small',null,'YouTubeのURL。プロフィールで再生できます')),video),
    el('p',{class:'note'},'ここに書いたものは、だれでも見られます。本名・学校名・住所などは書かないでね。'),
    msg, save);
  form.addEventListener('submit',async e=>{
    e.preventDefault(); msg.className='msg'; msg.textContent=''; T.clearFieldErr(form);
    const h=handle.value.trim().toLowerCase().replace(/^@/,'');
    if(!name.value.trim()){ T.fieldErr(form,name,'名前を入れてね'); return }
    if(!/^[a-z0-9_]{3,20}$/.test(h)){ T.fieldErr(form,handle,ERR.bad_handle); return }
    const ls=links.map(i=>i.value.trim()).filter(Boolean);
    const badL=links.find(i=>i.value.trim()&&!/^https:\/\/\S+$/.test(i.value.trim()));
    if(badL){ T.fieldErr(form,badL,ERR.bad_links); return }
    if(video.value.trim()&&!/^https:\/\/\S+$/.test(video.value.trim())){ T.fieldErr(form,video,'紹介動画は https:// から始まるURLにしてね'); return }
    save.disabled=true; msg.textContent='保存中…';
    try{
      if(newBlob){
        const path=SES.user.id+'/a-'+Date.now()+'.jpg';
        const up=await sb.storage.from('avatars').upload(path,newBlob,{contentType:'image/jpeg',cacheControl:'31536000'});
        if(up.error) throw {message:'bad_avatar'};
        // 前の画像は消す（自分のフォルダの中だけ）
        try{ const old=(await sb.storage.from('avatars').list(SES.user.id)).data||[]; const rm=old.map(o=>SES.user.id+'/'+o.name).filter(n=>n!==path); if(rm.length) await sb.storage.from('avatars').remove(rm) }catch(_){}
        avatarUrl=sb.storage.from('avatars').getPublicUrl(path).data.publicUrl; newBlob=null;
      }
      const {data,error}=await sb.rpc('profile_save',{p_handle:h,p_name:name.value.trim(),p_bio:bio.value.trim(),p_avatar_url:avatarUrl||null,p_links:ls,p_video:video.value.trim()||null});
      if(error) throw error;
      PROFILE=Object.assign({},data,{likes_public:!!(PROFILE&&PROFILE.likes_public)}); T.store.set('me',{name:data.name,avatar_url:data.avatar_url||'',handle:data.handle});
      TAB='edit'; render(); T.toast('保存したよ');
    }catch(err){ save.disabled=false; const m=err&&err.message; if(m==='handle_taken'||m==='bad_handle'){ T.fieldErr(form,handle,ERR[m]); return } msg.className='msg err'; msg.textContent=ERR[m||'']||'保存できなかった…時間をおいてもう一度試してね' }
  });
  pane.append(form);
  pane.append(publicBox());
}
if(sb) sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_IN'&&!SES) start() });
start();
})();
