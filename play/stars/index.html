<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/icon-32.png">
<title>ほしひろい</title>
<style>
*{-webkit-tap-highlight-color:transparent}
:root{--bg:#07131f;--ink:#eaf6ff;--muted:#8fb0c9;--line:#1f3a52}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;box-sizing:border-box;user-select:none;-webkit-user-select:none}
h1{margin:0;font-size:20px;letter-spacing:.06em}
p{margin:0;color:var(--muted);font-size:13px;text-align:center}
canvas{height:min(72vh,600px);max-width:100%;aspect-ratio:3/4;background:#0b1c2e;border-radius:12px;touch-action:none;cursor:pointer}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
</style>
</head>
<body>
<span class="tag">テストプレイ部 運営サンプル</span>
<h1>ほしひろい</h1>
<p>指（マウス）で左右に動かす。★をひろって、赤い岩はよける。45秒。キーボードは ← →。</p>
<canvas id="c" width="360" height="480" aria-label="ゲーム画面"></canvas>
<p id="best">ベスト：0</p>
<script>
(function(){
const c=document.getElementById('c'),g=c.getContext('2d'),W=360,H=480,PY=H-56,TIME=45;
let state='title',px=W/2,tx=W/2,items,parts,score,combo,life,t,best=0,hurt=0,keys={},bg=[];
for(let i=0;i<40;i++)bg.push({x:Math.random()*W,y:Math.random()*H,s:.3+Math.random()*1.2});
try{best=+localStorage.getItem('hoshi-best')||0}catch(e){}
const bestEl=document.getElementById('best');bestEl.textContent='ベスト：'+best;
function reset(){items=[];parts=[];score=0;combo=0;life=3;t=0;px=tx=W/2;hurt=0}
function toX(e){const r=c.getBoundingClientRect();return (e.clientX-r.left)/r.width*W}
c.addEventListener('pointerdown',e=>{e.preventDefault();if(state!=='play'){reset();state='play'}tx=toX(e);try{c.setPointerCapture(e.pointerId)}catch(_){}});
c.addEventListener('pointermove',e=>{if(state==='play'&&(e.pointerType==='mouse'||e.buttons||e.pressure>0))tx=toX(e)});
window.addEventListener('keydown',e=>{keys[e.code]=true;if((e.code==='Space'||e.code==='Enter')&&state!=='play'){e.preventDefault();reset();state='play'}if(e.code.startsWith('Arrow'))e.preventDefault()});
window.addEventListener('keyup',e=>{keys[e.code]=false});
function end(){state='over';const s=score;if(s>best){best=s;try{localStorage.setItem('hoshi-best',best)}catch(e){}bestEl.textContent='ベスト：'+best}}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=1+Math.random()*3;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:24,col})}}
function step(){
 for(const s of bg){s.y+=s.s*(state==='play'?2:.6);if(s.y>H){s.y=0;s.x=Math.random()*W}}
 if(state==='play'){
  t++;const sec=t/60,left=TIME-sec;
  if(keys.ArrowLeft||keys.KeyA)tx=Math.max(20,tx-7);if(keys.ArrowRight||keys.KeyD)tx=Math.min(W-20,tx+7);
  tx=Math.max(20,Math.min(W-20,tx));px+=(tx-px)*.28;
  const rate=Math.max(14,34-sec*.45);
  if(t%Math.round(rate)===0){const rock=Math.random()<Math.min(.5,.22+sec*.008);items.push({x:24+Math.random()*(W-48),y:-20,vy:2.2+sec*.05+Math.random()*1.4,rock,r:rock?15:12,a:Math.random()*6})}
  for(const it of items){it.y+=it.vy;it.a+=.05;
   if(!it.hit&&Math.abs(it.x-px)<it.r+16&&Math.abs(it.y-PY)<it.r+14){it.hit=true;
    if(it.rock){life--;combo=0;hurt=18;burst(it.x,it.y,'#ff6b6b',14);if(life<=0){end()}}
    else{combo++;score+=10+Math.min(40,(combo-1)*2);burst(it.x,it.y,'#ffe66d',8)}}
   if(!it.hit&&!it.rock&&it.y>H+10){it.hit=true;combo=0}}
  items=items.filter(i=>!i.hit&&i.y<H+30);
  if(left<=0&&state==='play')end();
 }
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.l--}parts=parts.filter(p=>p.l>0);
 draw();requestAnimationFrame(step);
}
function star(x,y,r,a){g.beginPath();for(let i=0;i<10;i++){const rr=i%2?r*.45:r,an=a+i*Math.PI/5;g.lineTo(x+Math.cos(an)*rr,y+Math.sin(an)*rr)}g.closePath();g.fill()}
function draw(){
 g.save();if(hurt>0){g.translate((Math.random()-.5)*hurt*.6,0);hurt--}
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#0a1a2c');gr.addColorStop(1,'#122c45');g.fillStyle=gr;g.fillRect(-10,0,W+20,H);
 g.fillStyle='#ffffff55';for(const s of bg)g.fillRect(s.x,s.y,s.s+.6,s.s+.6);
 if(items)for(const it of items){if(it.rock){g.fillStyle='#ff6b6b';g.beginPath();for(let i=0;i<7;i++){const an=it.a+i*6.283/7,rr=it.r*(i%2?.78:1);g.lineTo(it.x+Math.cos(an)*rr,it.y+Math.sin(an)*rr)}g.closePath();g.fill();g.fillStyle='#c94b4b';g.beginPath();g.arc(it.x-3,it.y-2,4,0,7);g.fill()}else{g.fillStyle='#ffe66d';star(it.x,it.y,it.r,it.a)}}
 for(const p of parts||[]){g.globalAlpha=p.l/24;g.fillStyle=p.col;g.fillRect(p.x,p.y,3,3)}g.globalAlpha=1;
 // かご（プレイヤー）
 g.fillStyle='#7fe0c9';g.beginPath();g.moveTo(px-24,PY-8);g.lineTo(px+24,PY-8);g.lineTo(px+16,PY+16);g.lineTo(px-16,PY+16);g.closePath();g.fill();
 g.fillStyle='#0b1c2e';g.fillRect(px-18,PY-4,36,4);
 g.restore();
 g.fillStyle='#eaf6ff';g.textAlign='left';g.font='bold 20px system-ui';
 if(state!=='title'){g.fillText(score,14,30);g.textAlign='right';g.fillText(Math.max(0,Math.ceil(TIME-t/60))+'秒',W-14,30);g.textAlign='center';g.fillStyle='#ff8f8f';g.fillText('♥'.repeat(Math.max(0,life))+'♡'.repeat(3-Math.max(0,life)),W/2,30);
  if(combo>=3&&state==='play'){g.fillStyle='#ffe66d';g.font='bold 14px system-ui';g.fillText(combo+' れんぞく！',W/2,52)}}
 g.textAlign='center';g.fillStyle='#eaf6ff';
 if(state==='title'){g.font='bold 24px system-ui';g.fillText('タップでスタート',W/2,H/2-10);g.font='14px system-ui';g.fillStyle='#8fb0c9';g.fillText('★は続けてひろうと点が上がる',W/2,H/2+18)}
 if(state==='over'){g.fillStyle='#000a';g.fillRect(0,H/2-70,W,130);g.fillStyle='#eaf6ff';g.font='bold 34px system-ui';g.fillText(score+' 点',W/2,H/2-18);g.font='14px system-ui';g.fillStyle='#8fb0c9';g.fillText(life<=0?'岩に3回ぶつかった…':'タイムアップ！',W/2,H/2+10);g.fillText('タップでもう一回',W/2,H/2+36)}
}
window.__dbg=()=>({state,score,px,life,items:(items||[]).map(i=>({x:i.x,y:i.y,rock:i.rock,vy:i.vy}))});
reset();step();
})();
</script>
</body>
</html>
