<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/icon-32.png">
<title>ひとつだけちがう</title>
<style>
*{-webkit-tap-highlight-color:transparent}
:root{--bg:#f6f3fb;--ink:#2a2438;--muted:#7a7090;--line:#ddd5ea}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;box-sizing:border-box;min-height:100vh;user-select:none;-webkit-user-select:none}
h1{margin:0;font-size:20px;letter-spacing:.06em}
p{margin:0;color:var(--muted);font-size:13px;text-align:center}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.hud{display:flex;gap:18px;font-weight:800;font-variant-numeric:tabular-nums;font-size:16px}
#board{display:grid;gap:6px;width:min(86vw,340px);aspect-ratio:1}
#board button{border:0;border-radius:18%;cursor:pointer;touch-action:manipulation;padding:0;min-width:0}
#board button.hit{outline:4px solid var(--ink);outline-offset:-4px}
#go{font:inherit;font-weight:800;font-size:16px;border:0;border-radius:999px;padding:12px 28px;background:var(--ink);color:var(--bg);cursor:pointer}
#msg{font-weight:800;min-height:1.4em;font-size:16px}
/* 横向きのスマホなど背が低いとき：見出しと説明を隠して詰め、スタートが画面に入るようにする */
@media (max-height:420px){h1,.tag,#rule,p.small,.lead{display:none}body{gap:4px;padding:6px 12px}}
@media (max-height:420px){#board{width:min(86vw,calc(100dvh - 170px))}}
</style>
</head>
<body>
<span class="tag">テストプレイ部 運営サンプル</span>
<h1>ひとつだけちがう</h1>
<p>1つだけ色がちがうマスをさがしてタップ。進むほどマスが増えて、色の差が小さくなる。まちがえると3秒へる。</p>
<div class="hud"><span id="lv">レベル 0</span><span id="time">30.0 秒</span></div>
<div id="msg" aria-live="polite">目のよさに自信はある？</div>
<div id="board" aria-label="マス"></div>
<button id="go" type="button">スタート</button>
<p id="best">ベスト：レベル 0</p>
<script>
(function(){
const $=id=>document.getElementById(id),board=$('board'),go=$('go');
let playing=false,lv=0,end=0,odd=-1,best=0,raf=0;
try{best=+localStorage.getItem('chigau-best')||0}catch(e){}
$('best').textContent='ベスト：レベル '+best;
function next(){lv++;$('lv').textContent='レベル '+lv;const n=Math.min(7,2+Math.floor((lv+1)/3)),cells=n*n;
 const h=Math.floor(Math.random()*360),s=55+Math.random()*25,l=50+Math.random()*12,d=Math.max(3.5,22-lv*1.3)*(Math.random()<.5?1:-1);
 odd=Math.floor(Math.random()*cells);board.style.gridTemplateColumns='repeat('+n+',1fr)';board.replaceChildren();
 for(let i=0;i<cells;i++){const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','マス'+(i+1));b.style.background='hsl('+h+','+s+'%,'+(i===odd?l+d:l)+'%)';
  b.addEventListener('pointerdown',e=>{e.preventDefault();pick(i,b)});board.append(b)}}
function pick(i,b){if(!playing)return;if(i===odd){$('msg').textContent=['いいね！','はやい！','するどい！','その調子！'][lv%4];next()}else{end-=3000;$('msg').textContent='そこじゃない！（−3秒）';b.style.opacity=.35}}
function tick(){const left=Math.max(0,end-performance.now());$('time').textContent=(left/1000).toFixed(1)+' 秒';if(left<=0){stop();return}raf=requestAnimationFrame(tick)}
function start(){playing=true;lv=0;go.hidden=true;$('msg').textContent='ちがう色はどれ？';end=performance.now()+30000;next();tick()}
function stop(){playing=false;cancelAnimationFrame(raf);const got=lv-1;if(board.children[odd])board.children[odd].classList.add('hit');$('msg').textContent='おわり！ レベル '+got+' までクリア（答えは黒わくのマス）';go.hidden=false;go.textContent='もう一回';
 if(got>best){best=got;try{localStorage.setItem('chigau-best',best)}catch(e){}$('best').textContent='ベスト：レベル '+best+'（こうしん！）'}}
go.addEventListener('click',start);
window.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!playing){e.preventDefault();start()}});
window.__dbg=()=>({playing,lv,odd});
})();
</script>
</body>
</html>
