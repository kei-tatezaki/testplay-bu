<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/icon-32.png">
<title>つみきタワー</title>
<style>
*{-webkit-tap-highlight-color:transparent}
:root{--bg:#1b1730;--ink:#f3f0ff;--muted:#a59fc4;--line:#3a335c}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;box-sizing:border-box;user-select:none;-webkit-user-select:none}
h1{margin:0;font-size:20px;letter-spacing:.06em}
p{margin:0;color:var(--muted);font-size:13px;text-align:center}
canvas{height:min(72vh,600px);max-width:100%;aspect-ratio:3/4;background:#221d3d;border-radius:12px;touch-action:manipulation;cursor:pointer}
.tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
</style>
</head>
<body>
<span class="tag">テストプレイ部 運営サンプル</span>
<h1>つみきタワー</h1>
<p>動くつみきを、タップ（またはスペースキー）で落とす。はみ出したぶんは切れる。</p>
<canvas id="c" width="360" height="480" aria-label="ゲーム画面"></canvas>
<p id="best">ベスト：0段</p>
<script>
(function(){
const c=document.getElementById('c'),g=c.getContext('2d'),W=360,H=480,BH=26,BASE=H-40;
const COL=['#ff8fab','#ffb86b','#ffe66d','#8ce99a','#74c0fc','#b197fc'];
let state='title',stack,cur,dir,speed,score,best=0,cam=0,camTo=0,falls=[],flash=0,perfect=0,msg='';
try{best=+localStorage.getItem('tsumiki-best')||0}catch(e){}
const bestEl=document.getElementById('best');bestEl.textContent='ベスト：'+best+'段';
function reset(){stack=[{x:100,w:160}];score=0;speed=2.4;cam=camTo=0;falls=[];perfect=0;msg='';spawn()}
function spawn(){const top=stack[stack.length-1];dir=stack.length%2?1:-1;cur={x:dir>0?-top.w:W,w:top.w}}
function drop(){
 const top=stack[stack.length-1];let l=Math.max(cur.x,top.x),r=Math.min(cur.x+cur.w,top.x+top.w),w=r-l;
 if(w<=0){falls.push({x:cur.x,w:cur.w,y:yOf(stack.length),vy:0,c:COL[stack.length%6]});over();return}
 if(Math.abs(cur.x-top.x)<=5){l=top.x;w=top.w;perfect++;flash=14;msg=perfect>1?'ぴったり ×'+perfect:'ぴったり！';if(perfect>=3&&w<200){w+=8;l-=4}}
 else{perfect=0;msg='';const cutL=cur.x<top.x;falls.push({x:cutL?cur.x:r,w:cur.w-w,y:yOf(stack.length),vy:0,c:COL[stack.length%6]})}
 stack.push({x:l,w:w});score++;speed=Math.min(7.5,2.4+score*.16);
 if(stack.length>7)camTo=(stack.length-7)*BH;spawn();
}
function over(){state='over';cur=null;if(score>best){best=score;try{localStorage.setItem('tsumiki-best',best)}catch(e){}bestEl.textContent='ベスト：'+best+'段'}}
function yOf(i){return BASE-i*BH+cam}
function press(){if(state!=='play'){reset();state='play'}else if(cur)drop()}
c.addEventListener('pointerdown',e=>{e.preventDefault();press()});
window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();if(!e.repeat)press()}});
function step(){
 if(state==='play'&&cur){cur.x+=dir*speed;if(cur.x>W-cur.w+60){dir=-1}else if(cur.x<-60){dir=1}}
 cam+=(camTo-cam)*.15;
 for(const f of falls){f.vy+=.6;f.y+=f.vy}falls=falls.filter(f=>f.y<H+40);
 draw();requestAnimationFrame(step);
}
function block(x,y,w,col){g.fillStyle=col;g.fillRect(x,y,w,BH-2);g.fillStyle='#ffffff30';g.fillRect(x,y,w,5);g.fillStyle='#00000026';g.fillRect(x,y+BH-7,w,5)}
function draw(){
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#2b2552');gr.addColorStop(1,'#1d1936');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.fillStyle='#ffffff14';for(let i=0;i<24;i++){const y=((i*53+cam*.3)%H+H)%H;g.fillRect((i*97)%W,y,2,2)}
 g.fillStyle='#3a335c';g.fillRect(0,BASE+BH+cam-2,W,H);
 if(state!=='title'||stack){(stack||[]).forEach((b,i)=>block(b.x,yOf(i),b.w,i===0?'#5b528c':COL[i%6]))}
 if(cur)block(cur.x,yOf(stack.length),cur.w,COL[stack.length%6]);
 for(const f of falls)block(f.x,f.y,f.w,f.c);
 if(flash>0){g.fillStyle='rgba(255,255,255,'+(flash/40)+')';g.fillRect(0,0,W,H);flash--}
 g.fillStyle='#f3f0ff';g.textAlign='center';
 if(state==='play'){g.font='bold 40px system-ui';g.fillText(score,W/2,64);if(msg){g.font='bold 16px system-ui';g.fillStyle='#ffe66d';g.fillText(msg,W/2,92)}}
 if(state==='title'){g.font='bold 24px system-ui';g.fillText('タップでスタート',W/2,H/2-10);g.font='14px system-ui';g.fillStyle='#a59fc4';g.fillText('ぴったり重ねると、つみきが切れない',W/2,H/2+18)}
 if(state==='over'){g.fillStyle='#0009';g.fillRect(0,H/2-70,W,130);g.fillStyle='#f3f0ff';g.font='bold 34px system-ui';g.fillText(score+' 段',W/2,H/2-18);g.font='14px system-ui';g.fillStyle='#a59fc4';g.fillText(score>=best&&score>0?'ベスト記録！':'ベスト '+best+' 段',W/2,H/2+10);g.fillText('タップでもう一回',W/2,H/2+36)}
}
window.__dbg=()=>({state,score,cur:cur&&{x:cur.x,w:cur.w},top:stack&&stack[stack.length-1],dir,speed});
reset();state='title';cur=null;step();
})();
</script>
</body>
</html>
