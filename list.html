<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作品一覧｜テストプレイ部</title>
<meta name="description" content="学生のゲームを、5分でつまみ食い。遊んで、一言感想を送り合う場所。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="テストプレイ部">
<meta property="og:title" content="作品一覧｜テストプレイ部">
<meta property="og:description" content="学生のゲームを、5分でつまみ食い。遊んで、一言感想を送り合う場所。">
<meta property="og:url" content="https://kei-tatezaki.github.io/testplay-bu/list.html">
<meta property="og:image" content="https://kei-tatezaki.github.io/testplay-bu/og/site.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1f6f6a">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap wide">
<header class="bar"><a class="brand" href="./list.html"><img src="assets/icon-192.png" alt="" width="32" height="32">テストプレイ部</a><a class="btn" href="./">▶ ショート</a></header>
<p class="lead">学生のゲームを、5分でつまみ食い。画像をタップするとショートで見られます。</p>
<nav class="filters" aria-label="絞り込み"><button type="button" aria-pressed="true" data-f="">すべて</button><button type="button" aria-pressed="false" data-f="チュートリアル">確かめたい：チュートリアル</button><button type="button" aria-pressed="false" data-f="操作感">確かめたい：操作感</button><button type="button" aria-pressed="false" data-f="楽しさ">確かめたい：楽しさ</button></nav>
<nav class="filters" aria-label="端末で絞り込み"><button type="button" aria-pressed="true" data-p="">どの端末でも</button><button type="button" aria-pressed="false" data-p="pc">PCで遊べる</button><button type="button" aria-pressed="false" data-p="sp">スマホで遊べる</button></nav>
<main id="list" class="grid">
<article class="tile" data-check="チュートリアル" data-plat="both">
<a class="thumb" href="./?g=lights" aria-label="ひかりけしをショートで見る"><img class="media" src="og/lights.png" alt="" loading="lazy"><span class="dur">3〜5分</span></a>
<div class="meta">
<a class="t" href="games/lights/">ひかりけし</a>
<div class="by">テストプレイ部 運営</div>
<div class="by">PC・スマホ ・ 確かめたい：チュートリアル</div>
<div class="by" data-stats="lights"></div>
</div>
</article>
<article class="tile" data-check="楽しさ" data-plat="both">
<a class="thumb" href="./?g=color" aria-label="いろタッチ30をショートで見る"><img class="media" src="og/color.png" alt="" loading="lazy"><span class="dur">30秒</span></a>
<div class="meta">
<a class="t" href="games/color/">いろタッチ30</a>
<div class="by">テストプレイ部 運営</div>
<div class="by">PC・スマホ ・ 確かめたい：楽しさ</div>
<div class="by" data-stats="color"></div>
</div>
</article>
<article class="tile" data-check="操作感" data-plat="both">
<a class="thumb" href="./?g=jump" aria-label="ワンタップ・ジャンプをショートで見る"><img class="media" src="og/jump.png" alt="" loading="lazy"><span class="dur">1〜3分</span></a>
<div class="meta">
<a class="t" href="games/jump/">ワンタップ・ジャンプ</a>
<div class="by">テストプレイ部 運営</div>
<div class="by">PC・スマホ ・ 確かめたい：操作感</div>
<div class="by" data-stats="jump"></div>
</div>
</article>
</main>
<p class="empty" id="empty" hidden>この条件の作品はまだありません。</p>
<footer>登録なしで遊べます ・ 感想は任意 ・ 3作品</footer>
</div>
<script>
let F='',P='';
// 遊んだ人・感想の数（YouTubeの再生回数のように表示）
fetch('https://jwrzqaxuvmdbroemenng.supabase.co/rest/v1/rpc/game_stats',{method:'POST',headers:{apikey:'sb_publishable_eEHa90AqCPKyQuo7jjMasA_sGbpPh2u','Content-Type':'application/json'},body:'{"since_days":3650}'})
 .then(r=>r.ok?r.json():[]).then(rows=>{(rows||[]).forEach(x=>{const el=document.querySelector('[data-stats="'+x.game_slug+'"]');if(!el)return;const t=[];if(x.plays)t.push('遊んだ人 '+x.plays+'人');if(x.feedbacks)t.push('感想 '+x.feedbacks+'件');el.textContent=t.join(' ・ ')})}).catch(()=>{});
function apply(){let n=0;document.querySelectorAll('#list .tile').forEach(c=>{const pl=c.dataset.plat;const okP=!P||pl==='both'||pl===P;const show=(!F||c.dataset.check===F)&&okP;c.hidden=!show;if(show)n++;});document.getElementById('empty').hidden=n>0;}
document.querySelectorAll('.filters button').forEach(b=>b.addEventListener('click',()=>{
 const nav=b.parentElement; nav.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
 if('f' in b.dataset)F=b.dataset.f; else P=b.dataset.p; apply();
}));
</script>
<script>
document.addEventListener('click',function(ev){
 var a=ev.target.closest&&ev.target.closest('a[data-play]'); if(!a) return;
 try{
  var cid=JSON.parse(localStorage.getItem('tpb:cid')||'""');
  if(!cid){cid=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now());localStorage.setItem('tpb:cid',JSON.stringify(cid))}
  var played=JSON.parse(localStorage.getItem('tpb:played')||'[]'); if(played.indexOf(a.dataset.play)<0){played.push(a.dataset.play);localStorage.setItem('tpb:played',JSON.stringify(played))}
  fetch('https://jwrzqaxuvmdbroemenng.supabase.co/rest/v1/game_events',{method:'POST',keepalive:true,headers:{apikey:'sb_publishable_eEHa90AqCPKyQuo7jjMasA_sGbpPh2u','Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({game_slug:a.dataset.play,kind:'play',client_id:cid})}).catch(function(){});
 }catch(e){}
});
</script>
</body>
</html>
