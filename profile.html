<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>プロフィール｜テストプレイ部</title>
<meta name="description" content="テストプレイ部で作品を出している人のプロフィールと、作品の一覧。">
<meta property="og:site_name" content="テストプレイ部">
<meta property="og:title" content="プロフィール｜テストプレイ部">
<meta property="og:image" content="https://kei-tatezaki.github.io/testplay-bu/og/site.png">
<meta name="theme-color" content="#F6F1E7">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="assets/style.css">
<link rel="stylesheet" href="assets/side.css">
<style>
.video{position:relative;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:#000;max-width:640px;width:100%}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vplay{position:absolute;inset:0;width:100%;height:100%;border:0;background:#111;color:#fff;display:grid;place-content:center;justify-items:center;gap:6px;cursor:pointer;font:inherit}
.vplay .vp{width:64px;height:64px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:26px}
.vplay .vt{font-weight:700}.vplay small{color:#bbb;font-size:12px}
.pane{display:grid;gap:12px;align-content:start;min-width:0}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 0}
.sec h2{margin:0;font-size:16px}
.note{font-size:13px;color:var(--muted);margin:0}
.skel{height:220px;display:grid;place-items:center;color:var(--muted)}
.kebab{flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;background:none;color:var(--ink);cursor:pointer;border-radius:50%}
.kebab:hover{background:var(--paper-2)}
.ph-acts .kebab{flex:none}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrap wide">
<header class="bar"><a class="brand" href="./"><img src="assets/icon-192.png" alt="" width="32" height="32">テストプレイ部</a><span class="brand-tag" aria-hidden="true">学生のゲームを、学生が遊ぶ部室</span><span class="bar-r"><a class="btn" href="./">▶ ショート</a><span data-me></span></span></header>
<main id="main" class="pf"><p class="skel">読み込み中…</p></main>
<footer><a href="./list.html">← 作品一覧に戻る</a><a href="./creators.html">作品を載せたい人へ</a></footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/data.js"></script>
<script src="assets/tpb.js"></script>
<script src="assets/mission.js"></script>
<script>
(async function(){
"use strict";
const T=TPB, el=T.el, main=document.getElementById('main'); const _rc=main.replaceChildren.bind(main); main.replaceChildren=(...a)=>_rc(...a.filter(x=>x!=null&&x!==false));
const u=(new URLSearchParams(location.search).get('u')||'').toLowerCase().replace(/^@/,'');
const linkLabel=T.linkLabel;
function ytId(url){ const m=String(url||'').match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/); return m?m[1]:'' }
function notFound(){
  main.replaceChildren(el('section',{class:'card'},el('div',{class:'body',style:'text-align:center'},
    el('h1',{style:'font-size:20px;margin:0'},'このプロフィールは見つかりませんでした'),
    el('p',{class:'muted',style:'margin:0'},'IDがまちがっているか、非表示になっています。'),
    el('p',{style:'margin:0'},el('a',{class:'btn',href:'./list.html'},'作品の一覧を見る')))));
}
if(!/^[a-z0-9_]{3,20}$/.test(u)){ notFound(); return }
const st=T.creators[u]||null;
const [live, statsRows, likeRows] = await Promise.all([T.pub('profile_get',{h:u}), T.pub('game_stats',{since_days:3650}), T.pub('public_likes',{p_handle:u})]);
if(!st && !live){ notFound(); return }
const p={
  handle:u, name:(live&&live.name)||(st&&st.name)||u, bio:(live&&live.bio)||(st&&st.bio)||'',
  avatar:(live&&live.avatar_url)||(st&&st.avatar?T.base+st.avatar:''), official:!!(st&&st.official),
  links:(live&&live.links&&live.links.length?live.links:(st&&st.links)||[]), video:(live&&live.video)||(st&&st.video)||''
};
const slugs=new Set(); T.games.forEach(g=>{ if(g.creator===u) slugs.add(g.slug) }); ((live&&live.games)||[]).forEach(s=>slugs.add(s));
const games=T.games.filter(g=>slugs.has(g.slug)).reverse();
const stats={}; (statsRows||[]).forEach(r=>stats[r.game_slug]=r);
let plays=0, fbs=0; games.forEach(g=>{ const s=stats[g.slug]; if(s){ plays+=s.plays||0; fbs+=s.feedbacks||0 } });

document.title=p.name+'｜テストプレイ部';
const url=(window.TPB_DATA.base||T.base.replace(/\/$/,''))+'/profile.html?u='+u;
// 自分のプロフィールか（本人なら「編集」、他人ならフォロー）
let mine=null;
if(T.maybeLoggedIn()){ try{ if(await T.session()) mine=(await T.sb().rpc('my_profile')).data||null }catch(e){} }
const isSelf=!!(mine&&mine.handle===u), canFollow=!!live&&!p.official&&!isSelf;
const [counts, following] = await Promise.all([live?T.follow.counts(u):null, canFollow&&T.maybeLoggedIn()?T.follow.state(u):false]);
const links=p.links.map(l=>{ const lab=linkLabel(l); return lab&&/^https:\/\//.test(l)?el('a',{href:l,target:'_blank',rel:'noopener nofollow ugc'},lab,el('span',{'aria-hidden':'true',class:'muted'},' ↗')):null }).filter(Boolean);
const vid=ytId(p.video);
const likeGames=(Array.isArray(likeRows)?likeRows:[]).map(r=>T.game(r.game_slug)).filter(Boolean);
let likesGot=0; games.forEach(g=>{ const s=stats[g.slug]; if(s) likesGot+=s.likes||0 });
const showNums=plays+fbs>=10||isSelf;

let TAB='games', head, bar;
const nums=[];
if(live){
  nums.push({k:'following',n:counts?counts.following:0,label:'フォロー中',onclick:()=>bar.pick('following')},
            {k:'followers',n:counts?counts.followers:0,label:'フォロワー',onclick:e=>T.userListSheet('followers',u,e.currentTarget)});
}
nums.push({n:games.length,label:'作品',onclick:()=>bar.pick('games')});
if(games.length&&showNums) nums.push({n:plays,label:'遊ばれた回数'},{n:likesGot,label:'いいね'});
const acts=[];
if(isSelf) acts.push(el('a',{class:'btn ghost',href:'./me.html#edit'},'プロフィールを編集'));
else if(canFollow) acts.push(T.follow.button(u,{following,onChange:(on,r)=>{ if(head&&r&&typeof r.followers==='number') head.setNum('followers',r.followers) }}));
acts.push(el('button',{class:'ibtn',type:'button','aria-label':'プロフィールのリンクを共有する',title:'共有',onclick:()=>T.share(p.name+'｜テストプレイ部',url)},T.svg('share',20)));
if(!p.official&&!isSelf) acts.push(el('button',{class:'kebab',type:'button','aria-label':'このプロフィールを報告する',title:'報告する',onclick:e=>T.report('profile',u,p.name,e.currentTarget)},T.svg('more',20)));
head=T.profileHead({name:p.name,handle:p.handle,avatar:p.avatar,official:p.official,bio:p.bio,nums,acts,links});

const tabs=[['games','作品']];
if(likeGames.length||isSelf) tabs.push(['likes','いいね']);
if(live) tabs.push(['following','フォロー中']);
const pane=el('div',{class:'pane',id:'pane',role:'tabpanel'});
function drawPane(){
  pane.replaceChildren(); pane.setAttribute('aria-labelledby','tab-'+TAB);
  if(TAB==='games'){
    if(window.TPB_DATA.allSample&&games.length&&games.every(g=>g.sample)) pane.append(el('div',{class:'notice',role:'note'},el('span',null,el('b',null,'いまは運営のお試し作品だけです。'),el('span',{class:'n2'},'最初の作品を募集中です。')),el('b',{class:'lfb'},'最初の1本は投稿無料'),el('a',{class:'btn',href:'./submit.html'},'作品を応募する')));
    if(vid) pane.append(el('div',{class:'sec'},el('h2',null,'紹介動画')),el('div',{class:'video'},el('button',{type:'button',class:'vplay','aria-label':p.name+' の紹介動画を見る（YouTubeから読み込みます）',onclick:e=>{
      const box=e.currentTarget.parentElement; box.replaceChildren(el('iframe',{src:'https://www.youtube-nocookie.com/embed/'+vid+'?autoplay=1',title:p.name+' の紹介動画',allow:'encrypted-media; picture-in-picture; autoplay',allowfullscreen:true}));
    }},el('span',{class:'vp','aria-hidden':'true'},'▶'),el('span',{class:'vt'},'紹介動画を見る'),el('small',null,'押すとYouTubeから読み込みます'))));
    if(games.length) pane.append(el('div',{class:'gtg'},games.map(g=>T.gthumb(g,{plays:(stats[g.slug]||{}).plays,menu:(a)=>T.sheet(g.title,el('div',{style:'display:grid;gap:2px'},[['作品ページを見る','./games/'+g.slug+'/'],['ショートで見る','./?g='+g.slug]].map(([l,h])=>el('a',{class:'tpb-mi',href:h},l))),a)}))));
    else pane.append(el('div',{class:'pane-eb'},T.ebImg(),el('p',{class:'eb-t'},'まだ作品はありません。公開されたら、ここに並びます')));
  } else if(TAB==='likes'){
    if(isSelf) pane.append(el('p',{class:'note'},mine.likes_public?'いいねした作品は公開中です（あなたにだけ出る案内です）。 ':'いいねした作品は公開していません。公開するまで、ほかの人には見えません。 ',el('a',{href:'./me.html#edit'},mine.likes_public?'非公開に切りかえる':'公開に切りかえる')));
    if(likeGames.length) pane.append(el('div',{class:'gtg'},likeGames.map(g=>T.gthumb(g,{plays:(stats[g.slug]||{}).plays}))));
    else pane.append(el('p',{class:'note'},mine&&mine.likes_public?'まだ、いいねした作品はありません。':'公開をオンにすると、いいねした作品がここに並びます。'));
  } else {
    pane.append(T.userList('following',u,{empty:'まだ、だれもフォローしていません'}));
  }
}
bar=T.tabs(tabs,TAB,k=>{ TAB=k; drawPane() },'プロフィール');
main.replaceChildren(head,bar,pane);
drawPane();
})();
</script>
</body>
</html>
