<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ワンタップ・ジャンプ｜テストプレイ部</title>
<meta name="description" content="タップでジャンプして、赤いブロックをよけ続けるランゲーム。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="テストプレイ部">
<meta property="og:title" content="ワンタップ・ジャンプ｜テストプレイ部">
<meta property="og:description" content="タップでジャンプして、赤いブロックをよけ続けるランゲーム。">
<meta property="og:url" content="https://kei-tatezaki.github.io/testplay-bu/games/jump/">
<meta property="og:image" content="https://kei-tatezaki.github.io/testplay-bu/og/jump.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1f6f6a">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../../assets/icon-192.png">
<link rel="apple-touch-icon" href="../../assets/icon-180.png">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<div class="wrap">
<a href="../../">← テストプレイ部（スワイプで見る）</a>
<article class="card">
<img class="media" src="../../og/jump.png" alt="ワンタップ・ジャンプ" loading="lazy">
<div class="body">
<h2>ワンタップ・ジャンプ</h2>
<div class="chips"><span class="chip plat">PC・スマホ</span><span class="chip sample">運営サンプル</span><span class="chip">プロトタイプ</span><span class="chip">ランゲーム</span><span class="chip">1〜3分</span><span class="chip check">確かめたい：操作感</span></div>
<p class="one">タップでジャンプして、赤いブロックをよけ続けるランゲーム。</p>
<div><b>見どころ</b><ul class="hl"><li>長押しすると高く跳べる</li><li>進むほどスピードが上がる</li><li>ベスト記録が残る</li></ul></div>
<div class="by">操作：タップ／スペースキー</div>
<div class="q"><b>作者が確かめたいこと</b>ジャンプの手触りは気持ちいい？長押しで高さが変わるのは伝わる？</div>

<div class="row"><a class="btn" href="../../play/jump/">▶ 遊ぶ</a><a class="btn ghost" href="../.././#fb-jump">💬 感想を送る</a></div>
<div class="by">by テストプレイ部 運営</div>
</div>
</article>
<section class="card"><div class="body"><h2>みんなの感想</h2><div id="fbsum" class="by"></div><div id="fb" class="fblist">読み込み中…</div></div></section>
<footer>感想はトップのフィードの「💬感想」から送れます</footer>
</div>
<script>
(async function(){
 const box=document.getElementById('fb'), sum=document.getElementById('fbsum');
 const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
 try{
  const r=await fetch('https://jwrzqaxuvmdbroemenng.supabase.co/rest/v1/feedback?select=again,reach,stop_at,good,bad,answer,free,is_dev,liked_by_dev,created_at&game_slug=eq.jump&order=created_at.desc&limit=100',{headers:{apikey:'sb_publishable_eEHa90AqCPKyQuo7jjMasA_sGbpPh2u'}});
  const rows=await r.json();
  if(!Array.isArray(rows)||!rows.length){box.textContent='まだ感想はありません。最初の感想を送ってみよう！';return}
  const much=rows.filter(x=>x.again==='すごく遊びたい').length, end=rows.filter(x=>x.reach==='最後まで').length;
  sum.textContent=rows.length+'件 ・ 「すごく遊びたい」'+Math.round(much/rows.length*100)+'% ・ 最後まで遊んだ '+Math.round(end/rows.length*100)+'%';
  box.innerHTML=rows.map(x=>'<div class="fbitem">'+(x.liked_by_dev?'<span class="chip check">作者のいいね</span> ':'')+(x.is_dev?'<span class="chip">開発者</span> ':'')+'<b>'+esc(x.again)+'</b> ・ '+esc(x.reach)+(x.stop_at?'（'+esc(x.stop_at)+'）':'')+(x.good.length?'<div>よかった：'+x.good.map(esc).join('、')+'</div>':'')+(x.bad.length?'<div>気になった：'+x.bad.map(esc).join('、')+'</div>':'')+(x.answer?'<div>作者の質問：'+esc(x.answer)+'</div>':'')+(x.free?'<p>'+esc(x.free)+'</p>':'')+'<div class="by">'+new Date(x.created_at).toLocaleDateString('ja-JP')+'</div></div>').join('');
 }catch(e){box.textContent='感想を読み込めませんでした'}
})();
</script>
</body>
</html>
