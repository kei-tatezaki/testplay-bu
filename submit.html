    pvMedia.replaceChildren(); if(media.file){ const m=media.kind==='video'?el('video',{muted:true,loop:true,autoplay:true,playsinline:true,src:media.url}):el('img',{src:media.url,alt:''}); if(media.kind==='video') m.muted=true; pvMedia.append(m) }
    pvBody.replaceChildren(...[el('div',{class:'by',style:'font-weight:700;color:var(--muted)'},'見本（押せません）'),pvMedia.childNodes.length?el('div',{class:'by'},media.kind==='video'?'ショートに出る動画':'ショートに出る画像'):null,pvMedia,
      el('h2',null,v('title')||'（作品名）'),
      el('p',{class:'one'},v('oneliner')||'（一言）'),
      el('div',{class:'row'},el('span',{class:'btn'},pk.kind==='download'?'⬇ 公開ページへ（ダウンロード）':'▶ 遊ぶ（'+v('minutes')+'）'),el('span',{class:'btn ghost'},'感想を送る')),
      el('div',{class:'chips'},v('rating')?el('span',{class:'chip rate-'+v('rating')},v('rating').toUpperCase()):null,
        pk.kind==='download'?el('span',{class:'chip plat'},['ダウンロード',osWin.checked&&osMac.checked?'Windows・Mac':osMac.checked?'Mac':'Windows',sizeIn.value.trim()?'約'+sizeIn.value.trim():''].filter(Boolean).join('・')):el('span',{class:'chip plat'},PL[v('platform')]),el('span',{class:'chip'},v('stage')),v('genre')?el('span',{class:'chip'},v('genre')):null,el('span',{class:'chip check'},'確かめたい：'+v('check'))),
      v('controls')?el('div',{class:'by'},'操作：'+v('controls')):null,
      v('question')?el('div',{class:'q'},el('b',null,'作者が確かめたいこと'),v('question')):null].filter(Boolean)) }
  form.addEventListener('input',drawPv); form.addEventListener('change',drawPv); drawPv();
  async function sendModel(d0){
    const d={type:'model',title:d0.title,oneliner:d0.oneliner,rating:d0.rating,note:d0.note,goal:d0.goal};
    for(const k in mf){ const v=mf[k].value.trim(); if(v) d[k]=v }
    d.model_rig=(form.querySelector('input[name=mrig]:checked')||{}).value||'no'; d.model_anim=(form.querySelector('input[name=manim]:checked')||{}).value||'no';
    d.fb_style=(form.querySelector('input[name=fbstyle]:checked')||{}).value||'both';
    if(!d.oneliner){ T.fieldErr(form,f.oneliner,'一言（どんなモデル？）を入れてね'); return }
    if(!d.model_use){ T.fieldErr(form,mf.model_use,'用途を選んでね'); return }
    if(!d.model_purpose){ T.fieldErr(form,mf.model_purpose,'目的を書いてね（何のためのモデル？ どう使う？）'); return }
    if(d.model_budget&&!/^[0-9]{1,7}$/.test(d.model_budget)){ T.fieldErr(form,mf.model_budget,'三角形の上限は数字だけで入れてね（例：15000）'); return }
    if(d.model_url&&!/^https:\/\/\S+$/.test(d.model_url)){ T.fieldErr(form,mf.model_url,'URLは https:// から始まるものを入れてね'); return }
    if(!model.file&&!d.model_url){ mdErr.textContent='モデルのファイルを選ぶか、見られるページのURLを入れてね'; mdPick.scrollIntoView({block:'center'}); return }
    const ups=[];
    btn.disabled=true; msg.className='msg';
    try{
      if(model.file){
        msg.textContent='モデルのファイルを送っています…';
        const path=SES.user.id+'/'+Date.now()+'.'+(/\.vrm$/i.test(model.file.name)?'vrm':'glb');
        const up=await sb.storage.from('submission-media').upload(path,model.file,{upsert:false,contentType:'model/gltf-binary'});
        if(up.error){ btn.disabled=false; msg.className='msg err'; msg.textContent=upErr(up.error); return }
        ups.push(path); d.model_path=path;
      }
      d.media_kind=media.kind;
      if(media.kind!=='auto'&&media.file){
        msg.textContent='動画・画像を送っています…';
        const p2=SES.user.id+'/'+Date.now()+'.'+EXT[media.file.type];
        const up2=await sb.storage.from('submission-media').upload(p2,media.file,{upsert:false,contentType:media.file.type});
        if(up2.error){ btn.disabled=false; msg.className='msg err'; msg.textContent=upErr(up2.error); if(ups.length) await sb.storage.from('submission-media').remove(ups).catch(()=>{}); return }
        ups.push(p2); d.media_path=p2;
      } else d.media_kind='auto';
    }catch(e){ btn.disabled=false; msg.className='msg err'; msg.textContent='送れなかった…電波のいいところでもう一度試してね'; return }
    const r=await send('new',null,d,btn,msg);
    if(!r&&ups.length){ try{ await sb.storage.from('submission-media').remove(ups) }catch(e){} }
    if(r) done('運営がモデルを開いて確かめてから、コメントを返します（マイページの「運営から」に届きます）。'+(r==='ok_free'?'最初の1本は投稿無料です。ポイントはつかっていません。':''));
  }
  form.addEventListener('submit',async e=>{ e.preventDefault();
    const d={}; for(const k in f){ const v=f[k].value.trim(); if(v) d[k]=v }
    T.clearFieldErr(form); msg.textContent='';
    if(!d.title){ T.fieldErr(form,f.title,'作品名を入れてね'); return }
    if(!agree.checked){ T.fieldErr(form,agree,'作品の権利と利用規約を確かめて、チェックを入れてね'); return }
    if(subType==='model') return sendModel(d);
    if(!d.play_url){ T.fieldErr(form,f.play_url,'遊べるURLを入れてね'); return }
    if(!d.oneliner){ T.fieldErr(form,f.oneliner,'一言（何をするゲーム？）を入れてね'); return }
    if(!/^https:\/\/\S+$/.test(d.play_url||'')){ T.fieldErr(form,f.play_url,'遊べるURLは https:// から始まるものを入れてね'); return }
    if(d.image_url&&!/^https:\/\/\S+$/.test(d.image_url)){ T.fieldErr(form,f.image_url,ERR.bad_url); return }
    d.play_kind=pk.kind; d.fb_style=(form.querySelector('input[name=fbstyle]:checked')||{}).value||'both';
    { const mb=mbIn.value.trim(); if(mb){ if(!/^[0-9]{1,6}(\.[0-9]{1,2})?$/.test(mb)||+mb<=0){ T.fieldErr(form,mbIn,'容量の目安は、MBの数字だけで入れてね（例：25）'); return } d.size_mb=mb } }
    if(pk.kind==='download'){
      const bad=dlCheck(d.play_url); if(bad){ T.fieldErr(form,f.play_url,DL_MSG[bad]); return }
      if(!osWin.checked&&!osMac.checked){ T.fieldErr(form,sizeIn,'対応OSを1つ以上選んでね'); return }
      d.platform='pc'; d.os=osWin.checked&&osMac.checked?'Windows・Mac':osMac.checked?'Mac':'Windows';
      const sz=sizeIn.value.trim(); if(sz) d.size=sz;
    }else{
      readEmbed(); if(embedIn.value.trim()&&!pk.embed){ T.fieldErr(form,embedIn,'https://itch.io/embed-upload/数字 を含む埋め込みコードを貼ってね。空にしてもOKです'); return }
      if(pk.embed) d.embed_url=pk.embed;
    }
    d.media_kind=media.kind; let upPath='';
    if(media.kind!=='auto'){
      if(!media.file){ mErr.textContent=media.kind==='video'?'動画のファイルを選んでね。のせないときは「運営におまかせ」にしてね':'画像のファイルを選んでね。のせないときは「運営におまかせ」にしてね'; fileIn.focus(); mSet.scrollIntoView({block:'center'}); return }
      btn.disabled=true; msg.className='msg'; msg.textContent='動画・画像を送っています…';
      upPath=SES.user.id+'/'+Date.now()+'.'+EXT[media.file.type];
      const up=await sb.storage.from('submission-media').upload(upPath,media.file,{upsert:false,contentType:media.file.type});
      if(up.error){ btn.disabled=false; msg.className='msg err'; msg.textContent=upErr(up.error); mErr.textContent=msg.textContent; if(msg.textContent===BIGMSG) mBig(); return }
      d.media_kind=media.kind; d.media_path=upPath; mErr.textContent='';
    }
    const r=await send('new',null,d,btn,msg);
    if(!r&&upPath){ try{ await sb.storage.from('submission-media').remove([upPath]) }catch(e){} }
    if(r) done('運営が遊んで確かめてから、作品ページを作ります。'+(r==='ok_free'?'最初の1本は投稿無料です。ポイントはつかっていません。（見送りになったときは、無料がもう一度使えます）':(PTS&&!PTS.is_admin?PTS.submit_cost+'pt つかいました（見送りになったときは返します）。':'')),true) });
  // 見本：スマホ・タブレットは、作品名の欄の上に置く（畳んでおく）。PC（1200px以上）は左の列（付箋・ポイントの下）に置く
  const sideCol=el('div',{class:'sidecol'},lfBox,ptBox), mq=matchMedia('(min-width:1200px)');
  function placePv(){ if(mq.matches) sideCol.append(pv); else form.insertBefore(pv,form.querySelector(':scope > label')||form.firstElementChild) }
  mq.addEventListener('change',placePv); placePv();
  main.classList.add('cols','wideside'); main.replaceChildren(sideCol,el('div',{class:'maincol'},form)); drawPts(); drawLf();
}
async function start(){
  SES=sb?await T.session():null;
  if(!SES){ drawLf(); main.replaceChildren(lfBox,T.loginBox('作品を応募するにはログインしてね','だれの作品かわかるように、応募はログインした人だけにしています。ログインすると、遊んだ人の数や感想を自分で見られるようになります。'),
    el('section',{class:'card'},el('div',{class:'body'},el('h2',{style:'font-size:16px;margin:0'},'フォームで聞かれること'),
      el('ul',{style:'margin:0;padding-left:1.2em;font-size:14px'},el('li',null,el('b',null,'必須：'),'作品名 ／ 遊べるURL ／ 一言（何をするゲーム？）'),el('li',null,'選ぶだけ：遊び方（ブラウザで遊べる／ダウンロードが必要。ダウンロード型は容量の目安と対応OSも）'),
        el('li',null,'選ぶだけ：対応端末・遊ぶ時間・確かめたいこと・どこまでできているか・年齢制限'),el('li',null,'書かなくてもOK：遊んだ人への質問・ジャンル・操作・画像のURL（なければ運営が作ります）・メモ'),el('li',null,'ショートに出す動画か画像は、選べます（動画60秒・50MBまで、画像10MBまで・任意）。選ばなければ、運営がプレイ動画を撮ります')),
      el('p',{class:'muted',style:'margin:0;font-size:13px'},'2〜3分で書けます。URLがまだない人は、',el('a',{href:'./creators.html#url'},'遊べるURLの作り方'),'へ。'))),
    el('p',{class:'muted',style:'text-align:center;font-size:14px;margin:0'},'ログインしたくない人は、',el('a',{href:window.TPB_DATA.discord,target:'_blank',rel:'noopener'},'Discord'),'で運営に声をかけてもOK。')); return }
  if(!editSlug) await loadPts();
  editSlug?editForm():newForm();
}
// ほかのタブでポイントがたまったとき、戻ってきたら見直す
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&SES&&!editSlug&&PTS) loadPts().then(drawPts) });
if(sb) sb.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_IN'&&!SES) start() });
start();
})();
